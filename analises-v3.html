<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análises em aberto · grid compacto (v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meris-tokens.css?v=61">
<link rel="stylesheet" href="styles.css?v=61">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="icons.jsx?v=61"></script>
<script type="text/babel" src="data.jsx?v=61"></script>
<script type="text/babel" src="components.jsx?v=61"></script>

<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F8FAFC; color: var(--color-text-primary); }
  .a3 { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }
  .a3-page-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .a3-page-sub { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: 18px; }

  /* Grid 2 colunas */
  .a3-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 900px) {
    .a3-grid { grid-template-columns: 1fr; }
  }

  /* Card compacto */
  .a3-card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex; flex-direction: column;
    gap: 6px;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .a3-card:hover { border-color: var(--color-border-strong, #CBD5E1); box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
  .a3-card__head {
    display: flex; align-items: flex-start; gap: 8px;
  }
  .a3-card__subject {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 600;
    color: var(--color-text-primary);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .a3-card__time {
    font-size: 11px;
    color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .a3-card__badges {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .a3-card__meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--color-text-tertiary);
  }
  .a3-card__meta-strong { color: var(--color-text-secondary); font-weight: 500; }
  .a3-card__meta-sep { color: var(--color-border-strong, #CBD5E1); }
  .a3-card__meta-mail {
    color: var(--color-text-tertiary);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .a3-card__meta { min-width: 0; }
  .a3-card__summary {
    font-size: 12px; line-height: 1.5;
    color: var(--color-text-secondary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .a3-card__footer {
    display: flex; align-items: center; gap: 4px;
    margin-top: 4px;
  }
  .a3-card__footer .icon-btn {
    width: 24px; height: 24px;
  }
  .a3-card__footer .icon-btn svg { width: 12px; height: 12px; }
  .a3-card__open {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 2px;
    background: transparent; color: var(--color-primary);
    border: 0; font-size: 11px; font-weight: 600;
    cursor: pointer; padding: 3px 6px; border-radius: 6px;
  }
  .a3-card__open:hover { background: #DBEAFE; }

  /* Override smaller badges in this view */
  .a3-card .crit-badge, .a3-card .path-badge, .a3-card .pinned__status {
    font-size: 10px; padding: 2px 7px; line-height: 14px;
  }
  .a3-card .crit-badge svg, .a3-card .path-badge svg { width: 10px; height: 10px; }

  /* Toolbar simples */
  .a3-toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px;
  }
  .a3-toolbar .select-input { font-size: 12px; height: 32px; padding: 0 30px 0 10px; }
  .a3-toolbar__spacer { flex: 1; }
  .a3-toolbar .btn { height: 32px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

function A3() {
  const [pareceres, setPareceres] = useState(() => window.PARECERES.filter(p => p.starred));
  const [filterCrit, setFilterCrit] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterArea, setFilterArea] = useState('all');

  const filtered = useMemo(() => pareceres.filter(p => {
    if (filterCrit === 'critical' && !(p.criticality === 'critical' && !p.pathRisk)) return false;
    if (filterCrit === 'path' && !p.pathRisk) return false;
    if (filterCrit === 'informative' && p.criticality !== 'informative') return false;
    if (filterStatus !== 'all' && p.status !== filterStatus) return false;
    if (filterArea !== 'all' && p.group !== filterArea) return false;
    return true;
  }), [pareceres, filterCrit, filterStatus, filterArea]);

  const statusLabel = (s) => ({ aguardando: 'Em aberto', em_analise: 'Em análise', notificada: 'Notificada', concluida: 'Concluída' }[s] || s);

  return (
    <div className="a3">
      <div className="a3-page-title">Análises em aberto · grid compacto (v3)</div>
      <div className="a3-page-sub">Variação alternativa com cards menores, dois por linha.</div>

      <div className="a3-toolbar">
        <select className="select-input" value={filterCrit} onChange={e => setFilterCrit(e.target.value)}>
          <option value="all">Classificação</option>
          <option value="critical">Críticos</option>
          <option value="path">Em caminho crítico</option>
          <option value="informative">Informativos</option>
        </select>
        <select className="select-input" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
          <option value="all">Status</option>
          <option value="aguardando">Em aberto</option>
          <option value="em_analise">Em análise</option>
          <option value="notificada">Notificada</option>
        </select>
        <select className="select-input" value={filterArea} onChange={e => setFilterArea(e.target.value)}>
          <option value="all">Área</option>
          {Object.values(window.GROUPS).map(g => <option key={g.id} value={g.id}>{g.label}</option>)}
        </select>
        <div className="a3-toolbar__spacer"></div>
        <button className="btn btn--primary btn--sm">
          <window.I.Plus size={14}/> Nova análise
        </button>
      </div>

      <div className="a3-grid">
        {filtered.map(p => (
          <div key={p.id} className="a3-card">
            <div className="a3-card__head">
              <div className="a3-card__subject">{p.subject}</div>
              <span className="a3-card__time">{p.date.split(' ')[0]}</span>
            </div>
            <div className="a3-card__badges">
              {p.pathRisk ? <window.PathBadge/> : <window.CritBadge kind={p.criticality}/>}
              <window.StatusPill status={p.status}/>
            </div>
            <div className="a3-card__meta">
              <window.I.Mail size={11}/>
              <span className="a3-card__meta-strong">{p.senderName}</span>
              {p.sender && <>
                <span className="a3-card__meta-sep">·</span>
                <span className="a3-card__meta-mail">{p.sender}</span>
              </>}
            </div>
            <div className="a3-card__summary">{p.summary}</div>
            <div className="a3-card__footer">
              <button className="icon-btn icon-btn--starred" title="Remover dos acompanhados"><window.I.BookmarkFilled size={12}/></button>
              <button className="icon-btn" title="Reclassificar"><window.I.Refresh size={12}/></button>
              <button className="icon-btn" title="Concluir"><window.I.CheckCircle size={12}/></button>
              <button className="icon-btn" title="Mais"><window.I.MoreHorizontal size={12}/></button>
              <button className="a3-card__open">Abrir análise <window.I.ChevronRight size={11}/></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<A3/>);
</script>
</body>
</html>
