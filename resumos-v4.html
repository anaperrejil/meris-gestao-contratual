<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed v4 · Cards dentro de áreas colapsáveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meris-tokens.css?v=44">
<link rel="stylesheet" href="styles.css?v=44">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="icons.jsx?v=44"></script>
<script type="text/babel" src="data.jsx?v=44"></script>
<script type="text/babel" src="components.jsx?v=44"></script>

<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F8FAFC; color: var(--color-text-primary); }
  .v4 { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }
  .v4-page-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .v4-page-sub { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: 18px; }

  /* Área no padrão "mês" da imagem 1 */
  .v4-area {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .v4-area__head {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: var(--color-bg-subtle);
    border-bottom: 1px solid var(--color-border);
    cursor: pointer;
  }
  .v4-area__head:hover { background: #EEF2F7; }
  .v4-area__icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--color-primary);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .v4-area__meta { flex: 1; min-width: 0; }
  .v4-area__name { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
  .v4-area__email { font-size: 12px; color: var(--color-text-tertiary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .v4-area__pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .v4-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px; font-weight: 500;
    background: var(--color-bg-subtle);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
  }
  .v4-pill strong { font-weight: 700; color: var(--color-text-primary); }
  .v4-pill--path { background: #FEF3C7; color: #92400E; border-color: transparent; }
  .v4-pill--path strong { color: #78350F; }
  .v4-pill--crit { background: #FEE2E2; color: #991B1B; border-color: transparent; }
  .v4-pill--crit strong { color: #7F1D1D; }
  .v4-area__chevron { color: var(--color-text-tertiary); transition: transform 150ms ease; flex: 0 0 auto; }
  .v4-area--open .v4-area__chevron { transform: rotate(180deg); }

  /* Lista de pareceres como cards */
  .v4-area__list {
    display: flex; flex-direction: column; gap: 12px;
    padding: 14px;
    background: var(--color-bg-subtle);
  }
  .v4-item {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .v4-item__head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .v4-item__subject {
    flex: 1; min-width: 0;
    font-size: 14px; font-weight: 600;
    color: var(--color-text-primary);
    line-height: 1.35;
  }
  .v4-item__head-right {
    display: inline-flex; align-items: center; gap: 8px;
    flex: 0 0 auto;
  }
  .v4-item__time {
    font-size: 12px; color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }

  /* Badges crit + status */
  .v4-row__crit-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    border-radius: 9999px;
    font-size: 11px; font-weight: 600;
    flex: 0 0 auto; line-height: 16px; white-space: nowrap;
  }
  .v4-row__crit-badge--path { background: #FEF3C7; color: #92400E; }
  .v4-row__crit-badge--crit { background: #FEE2E2; color: #991B1B; }
  .v4-row__crit-badge--info { background: var(--color-bg-subtle); color: var(--color-text-secondary); }
  .v4-row__status {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
    background: var(--color-bg-subtle);
    color: var(--color-text-secondary);
    flex: 0 0 auto; line-height: 16px; white-space: nowrap;
  }

  /* Conteúdo */
  .v4-detail__sender {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--color-text-secondary);
    margin-bottom: 8px;
  }
  .v4-detail__sender strong { color: var(--color-text-primary); font-weight: 600; }
  .v4-detail__summary {
    font-size: 13px; line-height: 1.55;
    color: var(--color-text-primary);
    margin-bottom: 10px;
  }
  .v4-detail__just {
    display: flex; gap: 10px;
    padding: 10px 12px;
    background: var(--color-bg-subtle);
    border-radius: 8px;
    font-size: 12px; color: var(--color-text-secondary);
    line-height: 1.5;
  }
  .v4-detail__just-label {
    font-size: 10px; font-weight: 700;
    color: var(--color-text-tertiary);
    text-transform: uppercase; letter-spacing: 0.05em;
    flex: 0 0 auto; padding-top: 1px;
  }
  .v4-detail__actions { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
  .v4-detail__spacer { flex: 1; }
  .v4-detail__open {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; color: var(--color-primary);
    border: 0; font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .v4-detail__open:hover { background: #DBEAFE; }

  /* Estado vazio de filtro */
  .v4-empty {
    text-align: center; padding: 32px; background: #fff;
    border: 1px dashed var(--color-border); border-radius: 12px;
    color: var(--color-text-tertiary); font-size: 13px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

function V4Feed() {
  const [pareceres, setPareceres] = useState(() => window.PARECERES);
  const [kpiFilter, setKpiFilter] = useState(null);
  const [collapsed, setCollapsed] = useState({});

  const total = pareceres.length;
  const onPath = pareceres.filter(p => p.pathRisk).length;
  const critical = pareceres.filter(p => !p.pathRisk && p.criticality === 'critical').length;
  const starred = pareceres.filter(p => p.starred).length;

  const filtered = useMemo(() => {
    if (!kpiFilter || kpiFilter === 'all') return pareceres;
    if (kpiFilter === 'path') return pareceres.filter(p => p.pathRisk);
    if (kpiFilter === 'critical') return pareceres.filter(p => !p.pathRisk && p.criticality === 'critical');
    if (kpiFilter === 'starred') return pareceres.filter(p => p.starred);
    return pareceres;
  }, [pareceres, kpiFilter]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach(p => { (map[p.group] = map[p.group] || []).push(p); });
    Object.values(map).forEach(arr => arr.sort((a, b) => {
      const w = (p) => (p.pathRisk ? 0 : p.criticality === 'critical' ? 1 : 2);
      return w(a) - w(b);
    }));
    return Object.entries(map).sort(([,a],[,b]) => {
      const ca = a.filter(p => p.pathRisk || p.criticality === 'critical').length;
      const cb = b.filter(p => p.pathRisk || p.criticality === 'critical').length;
      return cb - ca;
    });
  }, [filtered]);

  const setFilter = (id) => setKpiFilter(prev => prev === id ? null : id);
  const toggleCollapse = (id) => setCollapsed(prev => ({ ...prev, [id]: !prev[id] }));
  const toggleStar = (p) => setPareceres(prev => prev.map(x => x.id === p.id ? { ...x, starred: !x.starred } : x));

  const statusLabel = (s) => ({ aguardando: 'Em aberto', em_analise: 'Em análise', notificada: 'Notificada', concluida: 'Concluída' }[s] || s);

  return (
    <div className="v4">
      <div className="v4-page-title">Pareceres do @meris · variação v4</div>
      <div className="v4-page-sub">Mesma composição do feed principal (saudação + KPIs + áreas) aplicada ao novo card de parecer.</div>

      {/* Saudação */}
      <div className="greet">
        <window.MerisAvatar size={40}/>
        <div className="greet__main">
          <div className="greet__eyebrow">Monitoramento semanal</div>
          <div className="greet__title">Oi, Ana. Aqui está o que o @meris trouxe nos últimos 7 dias.</div>
          <div className="greet__body">
            Analisei <strong>247 e-mails</strong> da matriz de comunicação e levantei <strong>{total} pareceres</strong>
            {onPath > 0 && <> · <strong>{onPath} em caminho crítico</strong></>}
            {critical > 0 && <> · <strong>{critical} crítico{critical > 1 ? 's' : ''}</strong></>}
            {(onPath > 0 || critical > 0) ? '. Sugiro começar pelos itens em destaque.' : '. Nada urgente no horizonte.'}
          </div>
          <div className="greet__period">
            <window.I.Calendar size={12}/>
            <span>Período: últimos 7 dias · próximo resumo segunda-feira</span>
          </div>
        </div>
      </div>

      {/* KPIs */}
      <div className="kpis">
        {[
          { id: 'all',      tone: 'blue',   icon: 'Inbox',         label: 'Pareceres na fila',  value: total,    chip: 'últimos 7 dias' },
          { id: 'path',     tone: 'yellow', icon: 'AlertTriangle', label: 'Em caminho crítico', value: onPath,   chip: `de ${total}` },
          { id: 'critical', tone: 'red',    icon: 'AlertOctagon',  label: 'Críticos',           value: critical, chip: 'não atendidos' },
          { id: 'starred',  tone: 'blue',   icon: 'BookmarkFilled',label: 'Em aberto',          value: starred,  chip: 'marcados' },
        ].map(k => {
          const Icon = window.I[k.icon];
          const isActive = kpiFilter === k.id;
          return (
            <button key={k.id} type="button"
              className={`kpi kpi--${k.tone} ${isActive ? 'kpi--active' : ''}`}
              onClick={() => setFilter(k.id)}
              title={isActive ? 'Limpar filtro' : `Filtrar por ${k.label.toLowerCase()}`}>
              <div className="kpi__head">
                <span className="kpi__icon"><Icon size={18}/></span>
                <span className="kpi__label">{k.label}</span>
                {isActive && <window.I.X size={14} className="kpi__clear-icon"/>}
              </div>
              <div className="kpi__row">
                <span className="kpi__value">{k.value}</span>
                <span className="kpi__chip">{k.chip}</span>
              </div>
            </button>
          );
        })}
      </div>

      {/* Áreas */}
      {grouped.length === 0 && (
        <div className="v4-empty">Nenhum parecer com este filtro. Tente outro KPI ou limpe o filtro.</div>
      )}
      {grouped.map(([groupId, items]) => {
        const group = window.GROUPS[groupId];
        const Icon = window.I[group.icon] || window.I.Folders;
        const groupPath = items.filter(p => p.pathRisk).length;
        const groupCrit = items.filter(p => !p.pathRisk && p.criticality === 'critical').length;
        const isOpen = !collapsed[groupId];
        return (
          <div key={groupId} className={`v4-area ${isOpen ? 'v4-area--open' : ''}`}>
            <div className="v4-area__head" onClick={() => toggleCollapse(groupId)}>
              <span className="v4-area__icon"><Icon size={18}/></span>
              <div className="v4-area__meta">
                <div className="v4-area__name">{group.label}</div>
                <div className="v4-area__email">{group.email}</div>
              </div>
              <div className="area-card__stats" style={{fontSize:12, color:'var(--color-text-secondary)', display:'flex', gap:8, alignItems:'center'}}>
                <span className="area-stat"><strong>{items.length}</strong> pareceres</span>
                <span className="area-stat__sep">·</span>
                <span className={`area-stat ${groupPath > 0 ? 'area-stat--path' : 'area-stat--muted'}`}><strong>{groupPath}</strong> em caminho crítico</span>
                <span className="area-stat__sep">·</span>
                <span className={`area-stat ${groupCrit > 0 ? 'area-stat--critical' : 'area-stat--muted'}`}><strong>{groupCrit}</strong> crítico{groupCrit !== 1 ? 's' : ''}</span>
              </div>
              <window.I.ChevronDown size={16} className="v4-area__chevron"/>
            </div>

            {isOpen && (
              <div className="v4-area__list">
                {items.map(p => (
                  <div key={p.id} className="v4-item">
                    <div className="v4-item__head">
                      <div className="v4-item__subject">{p.subject}</div>
                      <div className="v4-item__head-right">
                        {p.pathRisk && <span className="v4-row__crit-badge v4-row__crit-badge--path"><window.I.AlertTriangle size={11}/> Em caminho crítico</span>}
                        {!p.pathRisk && p.criticality === 'critical' && <span className="v4-row__crit-badge v4-row__crit-badge--crit">Crítico</span>}
                        {!p.pathRisk && p.criticality === 'informative' && <span className="v4-row__crit-badge v4-row__crit-badge--info">Informativo</span>}
                        <span className="v4-row__status">{statusLabel(p.status)}</span>
                        <span className="v4-item__time">{p.date}</span>
                      </div>
                    </div>
                    <div className="v4-detail__sender">
                      <window.I.Mail size={12}/>
                      <strong>{p.senderName}</strong>
                      <span>·</span>
                      <span>{p.sender}</span>
                    </div>
                    <div className="v4-detail__summary">{p.summary}</div>
                    {p.justification && (
                      <div className="v4-detail__just">
                        <span className="v4-detail__just-label">Justificativa</span>
                        <span>{p.justification}</span>
                      </div>
                    )}
                    <div className="v4-detail__actions">
                      {p.status === 'concluida' ? (
                        <button className="icon-btn" title="Reabrir"><window.I.RotateCcw size={14}/></button>
                      ) : (
                        <>
                          <button className={`icon-btn ${p.starred ? 'icon-btn--starred' : ''}`}
                            title={p.starred ? 'Remover dos acompanhados' : 'Acompanhar'}
                            onClick={() => toggleStar(p)}>
                            {p.starred ? <window.I.BookmarkFilled size={14}/> : <window.I.Bookmark size={14}/>}
                          </button>
                          <button className="icon-btn" title="Reclassificar"><window.I.Refresh size={14}/></button>
                          <button className="icon-btn" title="Mais"><window.I.MoreHorizontal size={14}/></button>
                        </>
                      )}
                      <span className="v4-detail__spacer"></span>
                      <button className="v4-detail__open">Abrir análise <window.I.ChevronRight size={14}/></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<V4Feed/>);
</script>
</body>
</html>
