<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análises · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meris-tokens.css">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="icons.jsx?v=11"></script>
<script type="text/babel" src="data.jsx?v=11"></script>
<script type="text/babel" src="components.jsx?v=11"></script>

<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F8FAFC; color: var(--color-text-primary); }
  .v2-page { padding: 28px 40px; max-width: 1400px; margin: 0 auto; }

  /* Toolbar */
  .v2-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .v2-tabs { display: flex; gap: 6px; }
  .v2-tab {
    padding: 7px 14px;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 9999px;
    font: inherit;
    font-size: 13px; font-weight: 500;
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
  }
  .v2-tab:hover { background: var(--color-bg-subtle); }
  .v2-tab--active {
    background: var(--color-text-primary);
    border-color: var(--color-text-primary);
    color: #fff;
  }
  .v2-toolbar__right { display: flex; align-items: center; gap: 10px; }

  /* Search */
  .v2-search {
    display: flex; align-items: center; gap: 8px;
    height: 36px;
    padding: 0 14px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 9999px;
    min-width: 280px;
  }
  .v2-search input {
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 13px;
    color: var(--color-text-primary);
    flex: 1;
  }
  .v2-search input::placeholder { color: var(--color-text-tertiary); }
  .v2-search svg { color: var(--color-text-tertiary); }

  /* Icon buttons inline */
  .v2-icon-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 9999px;
    cursor: pointer;
    color: var(--color-text-secondary);
    transition: background 100ms ease;
  }
  .v2-icon-btn:hover { background: var(--color-bg-subtle); }

  /* Filtros button */
  .v2-filters-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 9999px;
    cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 500;
    color: var(--color-text-primary);
    transition: background 100ms ease;
  }
  .v2-filters-btn:hover { background: var(--color-bg-subtle); }
  .v2-filters-btn svg { color: var(--color-text-tertiary); }

  /* View toggle */
  .v2-view-toggle {
    display: inline-flex;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
  }
  .v2-view-toggle button {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent;
    cursor: pointer;
    color: var(--color-text-secondary);
  }
  .v2-view-toggle button.active {
    background: var(--color-text-primary);
    color: #fff;
  }

  /* Action buttons */
  .v2-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px;
    padding: 0 16px;
    border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease;
    white-space: nowrap;
  }
  .v2-btn--secondary {
    background: #fff;
    border: 1px solid var(--color-border);
    color: var(--color-text-primary);
  }
  .v2-btn--secondary:hover { background: var(--color-bg-subtle); }
  .v2-btn--primary {
    background: var(--color-primary);
    border: 1px solid var(--color-primary);
    color: #fff;
  }
  .v2-btn--primary:hover { background: var(--color-primary-dark); }

  /* Grid de cards */
  .v2-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }
  .v2-card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 20px 22px;
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease;
    min-height: 170px;
    display: flex; flex-direction: column;
  }
  .v2-card:hover {
    border-color: var(--color-border-strong);
    box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.04);
  }
  .v2-card__head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
  }
  .v2-card__title {
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 600;
    color: var(--color-text-primary);
    line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v2-card__head-icon { color: var(--color-text-tertiary); flex-shrink: 0; }
  .v2-card__menu {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0;
    border-radius: 6px;
    color: var(--color-text-secondary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .v2-card__menu:hover { background: var(--color-bg-subtle); }
  .v2-card__desc {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .v2-card__desc--empty { color: var(--color-text-tertiary); }

  .v2-card__inline-meta {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 12px;
  }
  .v2-card__inline-meta-item {
    display: inline-flex; align-items: center; gap: 5px;
  }
  .v2-card__inline-meta-item svg { color: var(--color-text-tertiary); }
  .v2-card__status-row { margin-bottom: 12px; }
  .v2-card__status {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--color-bg-subtle);
    color: var(--color-text-secondary);
    font-size: 12px; font-weight: 500;
  }
  .v2-card__status svg { opacity: 0.7; }
  .v2-card__footer {
    margin-top: auto;
    font-size: 11px;
    color: var(--color-text-tertiary);
  }

  /* Folder card – ícone azul tipo pasta */
  .v2-folder-icon {
    width: 24px; height: 24px;
    color: var(--color-primary);
    flex-shrink: 0;
  }
  .v2-folder-stats {
    display: flex; align-items: center; gap: 16px;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 16px;
  }
  .v2-folder-stat {
    display: inline-flex; align-items: center; gap: 5px;
  }
  .v2-folder-stat svg { color: var(--color-text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  function AnalisesV2() {
    const [tab, setTab] = useState('minhas');
    const [view, setView] = useState('grid');

    // Pastas mockadas
    const folders = [
      { id: 'f1', name: 'Nome da pasta', docs: 1, items: 1, author: 'Ana Perrejil', publica: true },
      { id: 'f2', name: 'Engenharia · Não conformidades', docs: 8, items: 4, author: 'Ana Perrejil', publica: false },
      { id: 'f3', name: 'Suprimentos · Atrasos', docs: 12, items: 6, author: 'Carlos Mendes', publica: true },
    ];

    // Análises a partir dos pareceres existentes
    const analises = window.PARECERES.slice(0, 6).map((p, i) => ({
      id: p.id,
      title: p.subject,
      desc: p.summary || 'Sem descrição',
      author: 'Ana Perrejil',
      docs: 1 + (i % 3),
      comments: i,
      status: p.criticality === 'critical' ? 'Pendente' : 'Em análise',
      statusIcon: p.criticality === 'critical' ? 'AlertOctagon' : 'Activity',
      createdAt: `${(i + 4) * 3} days ago`,
      locked: i % 2 === 0,
    }));

    return (
      <div className="v2-page">
        {/* Toolbar */}
        <div className="v2-toolbar">
          <div className="v2-tabs">
            <button className={`v2-tab ${tab === 'minhas' ? 'v2-tab--active' : ''}`} onClick={() => setTab('minhas')}>Minhas Análises</button>
            <button className={`v2-tab ${tab === 'publicas' ? 'v2-tab--active' : ''}`} onClick={() => setTab('publicas')}>Análises Públicas</button>
          </div>

          <div className="v2-toolbar__right">
            <div className="v2-search">
              <I.Search size={14}/>
              <input placeholder="Pesquisar análises..."/>
            </div>
            <button className="v2-icon-btn" title="Buscar"><I.Search size={14}/></button>
            <button className="v2-filters-btn">
              <I.Filter size={14}/> Filtros
            </button>
            <div className="v2-view-toggle">
              <button className={view === 'grid' ? 'active' : ''} onClick={() => setView('grid')} title="Grid">
                <I.LayoutGrid size={14}/>
              </button>
              <button className={view === 'list' ? 'active' : ''} onClick={() => setView('list')} title="Lista">
                <I.LayoutList size={14}/>
              </button>
            </div>
            <button className="v2-btn v2-btn--secondary"><I.FolderPlus size={14}/> Nova pasta</button>
            <button className="v2-btn v2-btn--primary"><I.Plus size={14}/> Criar Análise</button>
          </div>
        </div>

        {/* Grid */}
        <div className="v2-grid">
          {/* Folders */}
          {folders.map(f => (
            <div key={f.id} className="v2-card">
              <div className="v2-card__head">
                <svg className="v2-folder-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <path d="M3 6.5C3 5.67157 3.67157 5 4.5 5H9.5L11 7H19.5C20.3284 7 21 7.67157 21 8.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z"/>
                </svg>
                <span className="v2-card__title">{f.name}</span>
                {f.publica && <I.Globe size={14} className="v2-card__head-icon"/>}
                <button className="v2-card__menu" onClick={e => e.stopPropagation()}><I.MoreVertical size={16}/></button>
              </div>
              <div className="v2-folder-stats">
                <span className="v2-folder-stat"><I.FileText size={13}/> {f.docs}</span>
                <span className="v2-folder-stat"><I.Folders size={13}/> {f.items}</span>
              </div>
              <div className="v2-card__footer">Criada por {f.author}</div>
            </div>
          ))}

          {/* Analyses */}
          {analises.map(a => {
            const StatusIcon = I[a.statusIcon];
            return (
              <div key={a.id} className="v2-card">
                <div className="v2-card__head">
                  <span className="v2-card__title">{a.title}</span>
                  {a.locked && <I.Lock size={14} className="v2-card__head-icon"/>}
                  <button className="v2-card__menu" onClick={e => e.stopPropagation()}><I.MoreVertical size={16}/></button>
                </div>
                <div className={`v2-card__desc ${a.desc === 'Sem descrição' ? 'v2-card__desc--empty' : ''}`}>{a.desc}</div>
                <div className="v2-card__inline-meta">
                  <span className="v2-card__inline-meta-item"><I.User size={12}/> {a.author}</span>
                  <span className="v2-card__inline-meta-item"><I.FileText size={12}/> {a.docs} documento{a.docs > 1 ? 's' : ''}</span>
                  <span className="v2-card__inline-meta-item"><I.MessageSquare size={12}/> {a.comments} comentário{a.comments !== 1 ? 's' : ''}</span>
                </div>
                <div className="v2-card__status-row">
                  <span className="v2-card__status">
                    <StatusIcon size={12}/> {a.status}
                  </span>
                </div>
                <div className="v2-card__footer">Criado {a.createdAt}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<AnalisesV2/>);
</script>
</body>
</html>
