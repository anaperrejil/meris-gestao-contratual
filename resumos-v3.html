<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumos · Feed do passado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meris-tokens.css?v=21">
<link rel="stylesheet" href="styles.css?v=21">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="icons.jsx?v=21"></script>
<script type="text/babel" src="data.jsx?v=21"></script>
<script type="text/babel" src="components.jsx?v=21"></script>

<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F8FAFC; color: var(--color-text-primary); }
  .rv3 { display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  .rv3-head {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 28px;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
  }
  .rv3-head__crumb { font-size: 12px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .rv3-head__title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .rv3-head__search {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--color-bg-subtle);
    border: 1px solid transparent;
    border-radius: 9999px;
    padding: 0 14px;
    height: 36px;
    min-width: 280px;
  }
  .rv3-head__search input {
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 13px;
    color: var(--color-text-primary); flex: 1;
  }
  .rv3-head__search input::placeholder { color: var(--color-text-tertiary); }
  .rv3-head__search svg { color: var(--color-text-tertiary); }

  /* Filters */
  .rv3-filters {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 28px;
    background: #fff;
    border-bottom: 1px solid var(--color-border);
  }
  .rv3-filters__hint { margin-left: auto; font-size: 12px; color: var(--color-text-tertiary); }

  /* Period rail */
  .rv3-rail-wrap {
    background: #fff;
    border-bottom: 1px solid var(--color-border);
    padding: 14px 0;
  }
  .rv3-rail {
    display: flex; align-items: center; gap: 8px;
    padding: 0 28px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .rv3-rail::-webkit-scrollbar { height: 4px; }
  .rv3-rail::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 4px; }
  .rv3-rail-arrow {
    width: 32px; height: 32px;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--color-text-secondary);
    flex-shrink: 0;
  }
  .rv3-rail-arrow:hover { background: var(--color-bg-subtle); }
  .rv3-rail__group {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-text-tertiary);
    padding: 0 8px;
    align-self: center;
    white-space: nowrap;
  }

  .rv3-pill {
    flex-shrink: 0;
    display: flex; flex-direction: column;
    padding: 9px 14px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 12px;
    cursor: pointer;
    transition: background 100ms ease, border-color 100ms ease, box-shadow 100ms ease;
    min-width: 130px;
    font: inherit;
    text-align: left;
  }
  .rv3-pill:hover:not(:disabled) {
    border-color: var(--color-border-strong);
    background: var(--color-bg-subtle);
  }
  .rv3-pill--active {
    border-color: var(--color-primary);
    background: var(--color-primary-light);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .rv3-pill--match { box-shadow: 0 0 0 2px var(--color-warning); }
  .rv3-pill:disabled { opacity: 0.5; cursor: not-allowed; background: var(--color-bg-subtle); border-style: dashed; }
  .rv3-pill__head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .rv3-pill__dot { width: 6px; height: 6px; border-radius: 9999px; }
  .rv3-pill__dot--critical { background: var(--color-danger); }
  .rv3-pill__dot--path { background: var(--color-warning); }
  .rv3-pill__dot--info { background: var(--color-border-strong); }
  .rv3-pill__label { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
  .rv3-pill__progress {
    font-size: 11px; color: var(--color-text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .rv3-pill--active .rv3-pill__progress { color: var(--color-primary-dark); }

  /* Search status */
  .rv3-search-status {
    font-size: 12px;
    color: var(--color-warning-text);
    background: var(--color-warning-bg);
    padding: 8px 28px;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--color-warning-bg);
  }

  /* Main content area */
  .rv3-body {
    padding: 24px 28px 32px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }

  /* Empty state */
  .rv3-empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--color-text-secondary);
  }
  .rv3-empty-icon {
    width: 56px; height: 56px;
    border-radius: 9999px;
    background: var(--color-bg-subtle);
    color: var(--color-text-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }

  /* Concluded card indicator */
  .doc--concluded-rv3 {
    position: relative;
    padding-left: 12px !important;
  }
  .doc--concluded-rv3::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    background: var(--color-success-text, #16A34A);
    border-radius: 999px;
  }
  .doc__check-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    background: #DCFCE7;
    color: #166534;
    border-radius: 9999px;
    font-size: 11px; font-weight: 600;
  }

  .rv3-icon-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--color-border);
    background: #fff;
    border-radius: 9999px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--color-text-secondary);
  }
  .rv3-icon-btn:hover { background: var(--color-bg-subtle); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useMemo, useRef } = React;

  const TODAY = new Date(2026, 4, 12);
  const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const MONTHS_LONG = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const sameDay = (a, b) => isoDate(a) === isoDate(b);
  const parseParecerDate = (s) => {
    const [d, m, rest] = s.split('/');
    const [year, time] = rest.split(' ');
    const [hh, mm] = (time || '00:00').split(':');
    return new Date(+year, +m - 1, +d, +hh, +mm);
  };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(d.getDate() + n); return r; };
  const startOfWeek = (d) => { const r = new Date(d); const offset = (r.getDay() + 6) % 7; r.setDate(d.getDate() - offset); r.setHours(0,0,0,0); return r; };
  const fmtShort = (d) => `${String(d.getDate()).padStart(2,'0')} ${MONTHS_SHORT[d.getMonth()]}`;

  function ResumosV3() {
    const [pareceres, setPareceres] = useState(window.PARECERES);
    const [frequency, setFrequency] = useState('semanal');
    const [selected, setSelected] = useState(null); // ISO of period start
    const [search, setSearch] = useState('');
    const [filterArea, setFilterArea] = useState('all');
    const [filterCrit, setFilterCrit] = useState('all');
    const [filterStatus, setFilterStatus] = useState('all');
    const [kpiFilter, setKpiFilter] = useState(null);
    const [configOpen, setConfigOpen] = useState(false);
    const railRef = useRef(null);

    const pareceresByDate = useMemo(() => {
      const map = {};
      pareceres.forEach(p => {
        const dt = parseParecerDate(p.date);
        const key = isoDate(dt);
        (map[key] = map[key] || []).push(p);
      });
      return map;
    }, [pareceres]);

    const applyGlobalFilters = (items) => {
      return items.filter(p => {
        if (filterArea !== 'all' && p.group !== filterArea) return false;
        if (filterCrit === 'critical' && !(p.criticality === 'critical' && !p.pathRisk)) return false;
        if (filterCrit === 'path' && !p.pathRisk) return false;
        if (filterCrit === 'informative' && p.criticality !== 'informative') return false;
        if (filterStatus === 'open' && p.status === 'concluida') return false;
        if (filterStatus === 'completed' && p.status !== 'concluida') return false;
        if (search.trim()) {
          const q = search.toLowerCase();
          if (!p.subject.toLowerCase().includes(q) && !p.summary.toLowerCase().includes(q)) return false;
        }
        return true;
      });
    };

    // Gera períodos (semanas ou dias) passados, do mais recente para o mais antigo
    const periods = useMemo(() => {
      const out = [];
      if (frequency === 'semanal') {
        // 12 semanas anteriores à atual
        const currentWeekStart = startOfWeek(TODAY);
        for (let i = 1; i <= 12; i++) {
          const start = addDays(currentWeekStart, -7 * i);
          const end = addDays(start, 6);
          out.push({ start, end, key: isoDate(start), label: `${fmtShort(start)} – ${fmtShort(end)}` });
        }
      } else {
        // 30 dias anteriores ao atual
        for (let i = 1; i <= 30; i++) {
          const d = addDays(TODAY, -i);
          out.push({ start: d, end: d, key: isoDate(d), label: fmtShort(d) });
        }
      }
      return out;
    }, [frequency]);

    // Calcula meta para cada período
    const periodMeta = useMemo(() => {
      const map = {};
      periods.forEach(p => {
        const items = [];
        let d = new Date(p.start);
        const endT = new Date(p.end); endT.setHours(23,59,59,999);
        while (d <= endT) {
          (pareceresByDate[isoDate(d)] || []).forEach(it => items.push(it));
          d = addDays(d, 1);
        }
        const filtered = applyGlobalFilters(items);
        const crit = filtered.filter(x => !x.pathRisk && x.criticality === 'critical').length;
        const path = filtered.filter(x => x.pathRisk).length;
        const done = filtered.filter(x => x.status === 'concluida').length;
        const dominant = crit > 0 ? 'critical' : path > 0 ? 'path' : (filtered.length > 0 ? 'info' : 'empty');
        const hasMatch = search.trim() ? filtered.length > 0 : false;
        map[p.key] = { total: filtered.length, totalRaw: items.length, crit, path, done, dominant, items: filtered, hasMatch };
      });
      return map;
    }, [periods, pareceresByDate, filterArea, filterCrit, filterStatus, search]);

    // Pré-seleciona o período mais recente com itens
    React.useEffect(() => {
      if (!selected && periods.length > 0) {
        // tenta o primeiro com itens, senão o primeiro
        const firstWithItems = periods.find(p => periodMeta[p.key].totalRaw > 0);
        setSelected((firstWithItems || periods[0]).key);
      }
    }, [periods, periodMeta]);

    const selectedPeriod = periods.find(p => p.key === selected);
    const selectedMeta = selectedPeriod ? periodMeta[selectedPeriod.key] : null;
    const isSearching = search.trim().length > 0;

    const handleReopen = (parecer) => {
      setPareceres(prev => prev.map(p => p.id === parecer.id ? { ...p, status: 'em_analise' } : p));
    };

    const periodEyebrow = (p) => {
      if (frequency === 'semanal') {
        return `Semana de ${p.start.toLocaleDateString('pt-BR', { day:'numeric', month:'long' })} a ${p.end.toLocaleDateString('pt-BR', { day:'numeric', month:'long' })}`;
      }
      return p.start.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
    };

    // Filtro por KPI dentro do período selecionado
    const kpiFiltered = useMemo(() => {
      if (!selectedMeta) return [];
      if (!kpiFilter) return selectedMeta.items;
      if (kpiFilter === 'path') return selectedMeta.items.filter(p => p.pathRisk);
      if (kpiFilter === 'critical') return selectedMeta.items.filter(p => !p.pathRisk && p.criticality === 'critical');
      if (kpiFilter === 'open') return selectedMeta.items.filter(p => p.status !== 'concluida');
      return selectedMeta.items;
    }, [selectedMeta, kpiFilter]);

    // Agrupa por área
    const grouped = useMemo(() => {
      const map = {};
      kpiFiltered.forEach(p => { (map[p.group] = map[p.group] || []).push(p); });
      Object.values(map).forEach(arr => arr.sort((a, b) => {
        const w = (p) => (p.pathRisk ? 0 : p.criticality === 'critical' ? 1 : 2);
        return w(a) - w(b);
      }));
      return Object.entries(map).sort(([,a],[,b]) => {
        const ca = a.filter(p => p.pathRisk || p.criticality === 'critical').length;
        const cb = b.filter(p => p.pathRisk || p.criticality === 'critical').length;
        return cb - ca;
      });
    }, [kpiFiltered]);

    const KPIS_FOR_PERIOD = selectedMeta ? [
      { id: 'all', label: 'Todos', value: selectedMeta.items.length },
      { id: 'path', label: 'Em caminho crítico', value: selectedMeta.path },
      { id: 'critical', label: 'Críticos', value: selectedMeta.crit },
      { id: 'open', label: 'Em aberto', value: selectedMeta.items.filter(p => p.status !== 'concluida').length },
    ] : [];

    const scrollRail = (dir) => {
      if (railRef.current) railRef.current.scrollBy({ left: dir * 280, behavior: 'smooth' });
    };

    return (
      <div className="rv3">
        {/* Header */}
        <div className="rv3-head">
          <div>
            <div className="rv3-head__crumb">
              <I.Home size={11}/> <I.ChevronRight size={10}/> Gestão Contratual <I.ChevronRight size={10}/> Monitoramento <I.ChevronRight size={10}/> Resumos
            </div>
            <div className="rv3-head__title">Resumos</div>
          </div>
          <div className="rv3-head__search">
            <I.Search size={14}/>
            <input
              placeholder="Buscar em todos os resumos..."
              value={search}
              onChange={e => setSearch(e.target.value)}/>
            {search && <button onClick={() => setSearch('')} style={{border:0,background:'transparent',cursor:'pointer',color:'var(--color-text-tertiary)'}}><I.X size={13}/></button>}
          </div>
          <button className="rv3-icon-btn" title="Configurar frequência" onClick={() => setConfigOpen(true)}>
            <I.Settings size={15}/>
          </button>
        </div>

        {/* Filters */}
        <div className="rv3-filters">
          <select className="select-input" style={{width:160}} value={filterArea} onChange={e => setFilterArea(e.target.value)}>
            <option value="all">Área</option>
            {Object.values(window.GROUPS).map(g => <option key={g.id} value={g.id}>{g.label}</option>)}
          </select>
          <select className="select-input" style={{width:160}} value={filterCrit} onChange={e => setFilterCrit(e.target.value)}>
            <option value="all">Classificação</option>
            <option value="critical">Críticos</option>
            <option value="path">Em caminho crítico</option>
            <option value="informative">Informativos</option>
          </select>
          <select className="select-input" style={{width:160}} value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
            <option value="all">Todos os status</option>
            <option value="open">Em aberto</option>
            <option value="completed">Concluídos</option>
          </select>
          {(filterArea !== 'all' || filterCrit !== 'all' || filterStatus !== 'all') && (
            <button className="rv3-icon-btn" style={{width:'auto',padding:'0 12px',fontSize:12,fontWeight:500,color:'var(--color-primary)'}}
              onClick={() => { setFilterArea('all'); setFilterCrit('all'); setFilterStatus('all'); }}>
              Limpar
            </button>
          )}
          <span className="rv3-filters__hint">
            Frequência: <strong style={{color:'var(--color-text-primary)'}}>{frequency === 'diario' ? 'Diário' : 'Semanal'}</strong>
          </span>
        </div>

        {/* Period rail */}
        <div className="rv3-rail-wrap">
          <div className="rv3-rail" ref={railRef}>
            <button className="rv3-rail-arrow" onClick={() => scrollRail(-1)}><I.ChevronLeft size={14}/></button>
            {periods.map(p => {
              const m = periodMeta[p.key];
              const isActive = selected === p.key;
              const isEmpty = m.totalRaw === 0;
              return (
                <button
                  key={p.key}
                  className={[
                    'rv3-pill',
                    isActive ? 'rv3-pill--active' : '',
                    m.hasMatch && isSearching ? 'rv3-pill--match' : '',
                  ].join(' ')}
                  disabled={isEmpty}
                  onClick={() => { setSelected(p.key); setKpiFilter(null); }}>
                  <div className="rv3-pill__head">
                    {!isEmpty && <span className={`rv3-pill__dot rv3-pill__dot--${m.dominant === 'empty' ? 'info' : m.dominant}`}></span>}
                    <span className="rv3-pill__label">{p.label}</span>
                  </div>
                  <span className="rv3-pill__progress">
                    {isEmpty ? 'sem resumo' : `${m.done}/${m.total} concluídos`}
                  </span>
                </button>
              );
            })}
            <button className="rv3-rail-arrow" onClick={() => scrollRail(1)}><I.ChevronRight size={14}/></button>
          </div>
        </div>

        {isSearching && (
          <div className="rv3-search-status">
            <I.Search size={12}/> Mostrando resultados de "<strong>{search}</strong>" — pílulas com borda amarela contêm matches.
          </div>
        )}

        {/* Body — Feed layout */}
        <div className="rv3-body">
          {!selectedMeta && (
            <div className="rv3-empty">
              <div className="rv3-empty-icon"><I.Calendar size={24}/></div>
              <div style={{fontWeight:600,color:'var(--color-text-primary)',marginBottom:6}}>Ainda não há resumos anteriores</div>
              <div style={{fontSize:13}}>O próximo resumo aparece aqui após o ciclo atual.</div>
            </div>
          )}

          {selectedMeta && selectedPeriod && (
            <>
              {/* Briefing */}
              <div className="greet">
                <window.MerisAvatar size={40}/>
                <div className="greet__main">
                  <div className="greet__eyebrow">RESUMO {frequency === 'diario' ? 'DIÁRIO' : 'SEMANAL'}</div>
                  <div className="greet__title">{periodEyebrow(selectedPeriod)}</div>
                  <div className="greet__body">
                    {selectedMeta.total === 0 ? (
                      'Nenhum parecer no período com os filtros atuais.'
                    ) : (
                      <>Naquela {frequency === 'diario' ? 'data' : 'semana'} analisei <strong>{Math.round(selectedMeta.total * 35)} e-mails</strong> e levantei <strong>{selectedMeta.total} pareceres</strong>
                      {selectedMeta.path > 0 && <> · <strong>{selectedMeta.path} em caminho crítico</strong></>}
                      {selectedMeta.crit > 0 && <> · <strong>{selectedMeta.crit} crítico{selectedMeta.crit > 1 ? 's' : ''}</strong></>}
                      {'. '}
                      <strong>{selectedMeta.done} de {selectedMeta.total}</strong> já foram concluídos.</>
                    )}
                  </div>
                  <div className="greet__period">
                    <I.Calendar size={12}/>
                    <span>Período: {fmtShort(selectedPeriod.start)}{frequency === 'semanal' ? ` a ${fmtShort(selectedPeriod.end)}` : ''}</span>
                  </div>
                </div>
              </div>

              {/* KPIs do período */}
              {selectedMeta.items.length > 0 && (
                <div className="kpis">
                  {[
                    { id: 'all',      tone: 'blue',   icon: 'Inbox',         label: 'Pareceres', value: selectedMeta.items.length, chip: 'no período' },
                    { id: 'path',     tone: 'yellow', icon: 'AlertTriangle', label: 'Em caminho crítico', value: selectedMeta.path, chip: `de ${selectedMeta.items.length}` },
                    { id: 'critical', tone: 'red',    icon: 'AlertOctagon',  label: 'Críticos', value: selectedMeta.crit, chip: 'no período' },
                    { id: 'open',     tone: 'green',  icon: 'CheckCircle',   label: 'Em aberto', value: selectedMeta.items.filter(p => p.status !== 'concluida').length, chip: `de ${selectedMeta.items.length}` },
                  ].map(k => {
                    const Icon = I[k.icon];
                    const isActive = kpiFilter === k.id;
                    return (
                      <button
                        key={k.id}
                        type="button"
                        className={`kpi kpi--${k.tone} ${isActive ? 'kpi--active' : ''}`}
                        onClick={() => setKpiFilter(prev => prev === k.id ? null : k.id)}>
                        <div className="kpi__head">
                          <span className="kpi__icon"><Icon size={18}/></span>
                          <span className="kpi__label">{k.label}</span>
                          {isActive && <I.X size={14} className="kpi__clear-icon"/>}
                        </div>
                        <div className="kpi__row">
                          <span className="kpi__value">{k.value}</span>
                          <span className="kpi__chip">{k.chip}</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}

              {/* Pareceres por área — igual ao Feed */}
              {grouped.length === 0 && selectedMeta.items.length === 0 && (
                <div className="empty" style={{marginTop:24}}>
                  <div className="empty__title">Nenhum parecer no período</div>
                  <div className="empty__sub">Tente outro período ou ajuste os filtros acima.</div>
                </div>
              )}
              {grouped.map(([groupId, items]) => {
                const group = window.GROUPS[groupId];
                const Icon = I[group.icon] || I.Folders;
                const groupOnPath = items.filter(p => p.pathRisk).length;
                const groupCrit = items.filter(p => !p.pathRisk && p.criticality === 'critical').length;
                return (
                  <div key={groupId} className="area-card">
                    <div className="area-card__head">
                      <div className="area-card__left">
                        <span className="area-card__avatar"><Icon size={18}/></span>
                        <div className="area-card__main">
                          <div className="area-card__name">{group.label}</div>
                          <div className="area-card__sub"><span className="area-card__sub--mono">{group.email}</span></div>
                        </div>
                      </div>
                      <div className="area-card__stats">
                        <span className="area-stat"><strong>{items.length}</strong> pareceres</span>
                        <span className="area-stat__sep">·</span>
                        <span className={`area-stat ${groupOnPath > 0 ? 'area-stat--path' : 'area-stat--muted'}`}><strong>{groupOnPath}</strong> em caminho crítico</span>
                        <span className="area-stat__sep">·</span>
                        <span className={`area-stat ${groupCrit > 0 ? 'area-stat--critical' : 'area-stat--muted'}`}><strong>{groupCrit}</strong> crítico{groupCrit !== 1 ? 's' : ''}</span>
                      </div>
                    </div>
                    <div className="area-card__list">
                      {items.map(p => {
                        const concluded = p.status === 'concluida';
                        return (
                          <div key={p.id} className={`doc ${concluded ? 'doc--concluded-rv3' : ''}`}>
                            <div className="doc__head">
                              <div className="doc__subject">{p.subject}</div>
                              <div className="doc__head-right">
                                {p.pathRisk ? <window.PathBadge/> : <window.CritBadge kind={p.criticality}/>}
                                <window.StatusPill status={p.status}/>
                                {concluded && <span className="doc__check-badge"><I.Check size={10}/> Concluído</span>}
                                <span className="doc__time">{p.date}</span>
                              </div>
                            </div>
                            <div className="doc__meta">
                              <I.Mail size={12}/>
                              <span className="doc__meta-strong">{p.senderName}</span>
                              <span className="doc__meta-sep">·</span>
                              <span>{p.sender}</span>
                            </div>
                            <div className="doc__summary">{p.summary}</div>
                            {p.justification && (
                              <div className="doc__just">
                                <span className="doc__just-label">Justificativa</span>
                                <span>{p.justification}</span>
                              </div>
                            )}
                            <div className="doc__actions">
                              {!concluded && (
                                <>
                                  <button className="icon-btn" title="Acompanhar"><I.Bookmark size={14}/></button>
                                  <button className="icon-btn" title="Reclassificar"><I.Refresh size={14}/></button>
                                  <button className="icon-btn" title="Marcar como visto"><I.Eye size={14}/></button>
                                </>
                              )}
                              {concluded && (
                                <window.Dropdown
                                  trigger={<button className="icon-btn" title="Mais ações"><I.MoreHorizontal size={14}/></button>}
                                  items={[
                                    { icon: <I.RotateCcw size={14}/>, label: 'Reabrir análise', onClick: () => handleReopen(p) },
                                  ]}/>
                              )}
                              {!concluded && (
                                <window.Dropdown
                                  trigger={<button className="icon-btn" title="Mais"><I.MoreHorizontal size={14}/></button>}
                                  items={[
                                    { icon: <I.Users size={14}/>, label: 'Compartilhar análise' },
                                    { icon: <I.Send size={14}/>, label: 'Notificar grupo' },
                                  ]}/>
                              )}
                              <span className="doc__actions-spacer"></span>
                              <button className="doc__open">
                                Abrir análise <I.ChevronRight size={14}/>
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>

        {/* Config modal */}
        {configOpen && (
          <div className="modal__scrim fadein" onClick={() => setConfigOpen(false)}>
            <div className="modal modal--sm" onClick={e => e.stopPropagation()} style={{maxWidth:420}}>
              <div className="modal__header">
                <div className="modal__title-row"><I.Settings size={16}/><div className="modal__title">Frequência dos resumos</div></div>
                <div className="modal__sub">A mudança vale a partir do próximo ciclo. Resumos anteriores mantêm a granularidade em que foram gerados.</div>
              </div>
              <div className="modal__body">
                <div className="onboard-freq__cards">
                  {[
                    { id: 'diario', title: 'Diário', desc: 'Manhãs de seg. a sex.' },
                    { id: 'semanal', title: 'Semanal', desc: 'Segundas pela manhã.' },
                  ].map(opt => (
                    <button key={opt.id}
                      className={`onboard-freq__card ${frequency === opt.id ? 'onboard-freq__card--active' : ''}`}
                      onClick={() => { setFrequency(opt.id); setSelected(null); }}>
                      <div className="onboard-freq__head"><I.Calendar size={15}/><span className="onboard-freq__name">{opt.title}</span></div>
                      <div className="onboard-freq__desc">{opt.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div className="modal__footer">
                <button className="btn btn--primary" onClick={() => setConfigOpen(false)}>Salvar</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<ResumosV3/>);
</script>
</body>
</html>
