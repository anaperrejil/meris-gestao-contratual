<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERIS · Chat workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meris-tokens.css">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="icons.jsx?v=12"></script>
<script type="text/babel" src="data.jsx?v=12"></script>
<script type="text/babel" src="components.jsx?v=12"></script>

<style>
  body { margin: 0; font-family: 'Inter', sans-serif; background: #F8FAFC; color: var(--color-text-primary); }

  .ws { display: grid; grid-template-columns: 280px 1fr; height: 100vh; background: #F8FAFC; }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .ws-side {
    background: #fff;
    border-right: 1px solid var(--color-border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .ws-side__head {
    padding: 18px 18px 12px;
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; gap: 10px;
  }
  .ws-side__logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--color-primary);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .ws-side__org { display: flex; flex-direction: column; line-height: 1.2; }
  .ws-side__org-name { font-size: 14px; font-weight: 600; }
  .ws-side__org-sub { font-size: 11px; color: var(--color-text-tertiary); }

  .ws-side__scroll { flex: 1; overflow-y: auto; padding: 14px 8px; }

  .ws-section { margin-bottom: 18px; }
  .ws-section__head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px 4px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--color-text-tertiary);
  }
  .ws-section__head svg { color: var(--color-text-tertiary); opacity: 0.7; }

  .ws-channel {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px;
    margin-bottom: 1px;
    border: 0; background: transparent;
    border-radius: 6px;
    width: 100%;
    cursor: pointer;
    font: inherit; font-size: 13px;
    color: var(--color-text-primary);
    text-align: left;
    transition: background 100ms ease;
  }
  .ws-channel:hover { background: var(--color-bg-subtle); }
  .ws-channel--active {
    background: var(--color-primary-light);
    color: var(--color-primary-dark);
    font-weight: 500;
  }
  .ws-channel__hash {
    width: 14px; flex-shrink: 0;
    color: var(--color-text-tertiary);
    font-weight: 400;
  }
  .ws-channel--active .ws-channel__hash { color: var(--color-primary); }

  .ws-thread {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px;
    margin-bottom: 1px;
    border: 0; background: transparent;
    border-radius: 6px;
    width: 100%;
    cursor: pointer;
    font: inherit; font-size: 13px;
    color: var(--color-text-primary);
    text-align: left;
    transition: background 100ms ease;
    line-height: 1.35;
  }
  .ws-thread:hover { background: var(--color-bg-subtle); }
  .ws-thread--active { background: var(--color-bg-subtle); }
  .ws-thread__dot {
    width: 8px; height: 8px; border-radius: 9999px;
    flex-shrink: 0; margin-top: 5px;
  }
  .ws-thread__dot--critical { background: var(--color-danger); }
  .ws-thread__dot--path { background: var(--color-warning); }
  .ws-thread__dot--info { background: var(--color-border-strong); }
  .ws-thread__title {
    flex: 1; min-width: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 12.5px;
  }
  .ws-thread__unread {
    flex-shrink: 0;
    background: var(--color-primary); color: #fff;
    border-radius: 9999px;
    font-size: 10px; font-weight: 600;
    padding: 1px 6px;
    min-width: 18px; text-align: center;
  }

  .ws-side__foot {
    border-top: 1px solid var(--color-border);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .ws-side__avatar {
    width: 28px; height: 28px;
    border-radius: 9999px;
    background: var(--color-bg-subtle);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .ws-side__name { font-size: 13px; font-weight: 500; flex: 1; }
  .ws-side__status { font-size: 11px; color: var(--color-text-tertiary); }

  /* ── Main area ───────────────────────────────────────────────── */
  .ws-main { display: flex; flex-direction: column; overflow: hidden; background: #F8FAFC; }

  .ws-head {
    padding: 16px 28px;
    border-bottom: 1px solid var(--color-border);
    background: #fff;
    display: flex; align-items: center; gap: 12px;
  }
  .ws-head__title { font-size: 17px; font-weight: 600; flex: 1; }
  .ws-head__title .hash { color: var(--color-text-tertiary); margin-right: 4px; font-weight: 500; }
  .ws-head__meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--color-text-secondary);
  }

  .ws-feed { flex: 1; overflow-y: auto; padding: 28px 32px 16px; }
  .ws-feed-inner { max-width: 800px; margin: 0 auto; }

  .ws-msg {
    display: flex; gap: 12px;
    margin-bottom: 24px;
  }
  .ws-msg__avatar {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--color-primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ws-msg__avatar--user {
    background: var(--color-bg-subtle);
    border: 1px solid var(--color-border);
    color: var(--color-text-primary);
    font-size: 12px; font-weight: 600;
  }
  .ws-msg__body { flex: 1; min-width: 0; }
  .ws-msg__head {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .ws-msg__name { font-size: 14px; font-weight: 600; }
  .ws-msg__time { font-size: 11px; color: var(--color-text-tertiary); }
  .ws-msg__content { font-size: 14px; line-height: 1.55; color: var(--color-text-primary); }
  .ws-msg__content p { margin: 0 0 10px; }
  .ws-msg__content p:last-child { margin-bottom: 0; }

  .ws-thread-card {
    display: block;
    margin: 12px 0;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .ws-thread-card:hover {
    border-color: var(--color-border-strong);
    box-shadow: 0 1px 3px rgba(15,23,42,0.04);
  }
  .ws-thread-card__head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .ws-thread-card__title { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; }
  .ws-thread-card__chev { color: var(--color-text-tertiary); flex-shrink: 0; }
  .ws-thread-card__summary {
    font-size: 12.5px; color: var(--color-text-secondary);
    line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 6px;
  }
  .ws-thread-card__open {
    font-size: 11.5px; color: var(--color-primary);
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 500;
  }

  /* Composer */
  .ws-composer { padding: 12px 32px 8px; }
  .ws-composer-inner {
    max-width: 800px; margin: 0 auto;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.04);
    padding: 4px;
  }
  .ws-composer-inner:focus-within {
    border-color: var(--color-border-strong);
    box-shadow: 0 1px 3px rgba(15,23,42,0.06), 0 8px 24px rgba(15,23,42,0.06);
  }
  .ws-composer textarea {
    display: block; width: 100%;
    min-height: 44px; max-height: 160px;
    padding: 12px 14px 6px;
    border: 0; outline: 0;
    font: inherit; font-size: 14px;
    color: var(--color-text-primary);
    background: transparent;
    resize: none; box-sizing: border-box;
  }
  .ws-composer textarea::placeholder { color: var(--color-text-tertiary); }
  .ws-composer__toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px;
  }
  .ws-composer__left { display: flex; gap: 2px; }
  .ws-composer__icon-btn {
    width: 30px; height: 30px;
    border: 0; background: transparent;
    border-radius: 999px;
    color: var(--color-text-tertiary);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ws-composer__icon-btn:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }
  .ws-composer__send {
    width: 30px; height: 30px;
    border: 0; border-radius: 999px;
    background: var(--color-text-primary); color: #fff;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ws-composer__send:disabled { background: var(--color-bg-subtle); color: var(--color-text-tertiary); cursor: default; }

  .ws-disclaimer { padding: 4px 32px 12px; text-align: center; font-size: 11px; color: var(--color-text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  function ChatV2() {
    const [active, setActive] = useState('resumo'); // 'resumo' | parecerId
    const [composer, setComposer] = useState('');
    const pareceres = window.PARECERES;
    const critPareceres = pareceres.filter(p => p.pathRisk || p.criticality === 'critical');
    const otherPareceres = pareceres.filter(p => !p.pathRisk && p.criticality !== 'critical');

    const activeParecer = pareceres.find(p => p.id === active);

    return (
      <div className="ws">
        {/* Sidebar */}
        <aside className="ws-side">
          <div className="ws-side__head">
            <div className="ws-side__logo">M</div>
            <div className="ws-side__org">
              <span className="ws-side__org-name">Coodex · HC²</span>
              <span className="ws-side__org-sub">Gestão Contratual</span>
            </div>
          </div>
          <div className="ws-side__scroll">
            <div className="ws-section">
              <div className="ws-section__head"><I.MessageSquare size={12}/> Chats</div>
              <button
                className={`ws-channel ${active === 'resumo' ? 'ws-channel--active' : ''}`}
                onClick={() => setActive('resumo')}>
                <span className="ws-channel__hash">#</span>
                <span>resumo-semanal</span>
              </button>
            </div>

            <div className="ws-section">
              <div className="ws-section__head"><I.AlertTriangle size={12}/> Pareceres críticos · {critPareceres.length}</div>
              {critPareceres.map(p => (
                <button
                  key={p.id}
                  className={`ws-thread ${active === p.id ? 'ws-thread--active' : ''}`}
                  onClick={() => setActive(p.id)}>
                  <span className={`ws-thread__dot ws-thread__dot--${p.pathRisk ? 'path' : 'critical'}`}></span>
                  <span className="ws-thread__title">{p.subject}</span>
                  {active !== p.id && <span className="ws-thread__unread">1</span>}
                </button>
              ))}
            </div>

            <div className="ws-section">
              <div className="ws-section__head"><I.Inbox size={12}/> Outros · {otherPareceres.length}</div>
              {otherPareceres.map(p => (
                <button
                  key={p.id}
                  className={`ws-thread ${active === p.id ? 'ws-thread--active' : ''}`}
                  onClick={() => setActive(p.id)}>
                  <span className="ws-thread__dot ws-thread__dot--info"></span>
                  <span className="ws-thread__title">{p.subject}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="ws-side__foot">
            <div className="ws-side__avatar">AP</div>
            <div style={{flex:1, minWidth:0}}>
              <div className="ws-side__name">Ana Perrejil</div>
              <div className="ws-side__status">● online</div>
            </div>
            <button className="ws-composer__icon-btn" title="Configurações"><I.Settings size={14}/></button>
          </div>
        </aside>

        {/* Main */}
        <div className="ws-main">
          {active === 'resumo' ? (
            <ResumoView pareceres={pareceres} critPareceres={critPareceres} onOpenThread={setActive}/>
          ) : (
            <ThreadView parecer={activeParecer}/>
          )}

          <div className="ws-composer">
            <div className="ws-composer-inner">
              <textarea
                placeholder={active === 'resumo' ? 'Pergunte qualquer coisa sobre o resumo da semana…' : `Mensagem em #${activeParecer ? slug(activeParecer.subject) : ''}…`}
                value={composer}
                onChange={e => setComposer(e.target.value)}/>
              <div className="ws-composer__toolbar">
                <div className="ws-composer__left">
                  <button className="ws-composer__icon-btn" title="Anexar"><I.Paperclip size={15}/></button>
                  <button className="ws-composer__icon-btn" title="Skills"><I.Sparkles size={15}/></button>
                  <button className="ws-composer__icon-btn" title="Mencionar"><I.AtSign size={15}/></button>
                </div>
                <button className="ws-composer__send" disabled={!composer.trim()} onClick={() => setComposer('')}>
                  <I.Send size={13}/>
                </button>
              </div>
            </div>
          </div>
          <div className="ws-disclaimer">MERIS pode produzir respostas incorretas. Sempre verifique com a fonte original.</div>
        </div>
      </div>
    );
  }

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
  }

  function ResumoView({ pareceres, critPareceres, onOpenThread }) {
    const total = pareceres.length;
    const onPath = pareceres.filter(p => p.pathRisk).length;
    const crit = pareceres.filter(p => !p.pathRisk && p.criticality === 'critical').length;

    return (
      <>
        <div className="ws-head">
          <div className="ws-head__title"><span className="hash">#</span> resumo-semanal</div>
          <div className="ws-head__meta">
            <span>{total} pareceres · {pareceres.length} threads</span>
          </div>
        </div>
        <div className="ws-feed">
          <div className="ws-feed-inner">
            <div className="ws-msg">
              <div className="ws-msg__avatar"><I.Sparkles size={18}/></div>
              <div className="ws-msg__body">
                <div className="ws-msg__head">
                  <span className="ws-msg__name">Meris AI</span>
                  <span className="ws-msg__time">hoje · 08:00</span>
                </div>
                <div className="ws-msg__content">
                  <p><strong>Bom dia, Ana</strong> 👋</p>
                  <p>
                    Analisei <strong>247 e-mails</strong> da matriz de comunicação e levantei <strong>{total} pareceres</strong>
                    {onPath > 0 && <> — <strong>{onPath} em caminho crítico</strong></>}
                    {crit > 0 && <> e <strong>{crit} crítico{crit > 1 ? 's' : ''}</strong></>}.
                    Sugiro priorizar os itens abaixo. Abra cada thread para aprofundar a análise.
                  </p>
                </div>
              </div>
            </div>

            <div className="ws-msg">
              <div className="ws-msg__avatar"><I.Sparkles size={18}/></div>
              <div className="ws-msg__body">
                <div className="ws-msg__head">
                  <span className="ws-msg__name">Meris AI</span>
                  <span className="ws-msg__time">hoje · 08:01</span>
                </div>
                <div className="ws-msg__content">
                  <p style={{fontWeight:600, fontSize:13, color:'var(--color-text-secondary)', textTransform:'uppercase', letterSpacing:'0.04em'}}>Pareceres críticos</p>
                  {critPareceres.map(p => (
                    <a key={p.id} className="ws-thread-card" onClick={() => onOpenThread(p.id)}>
                      <div className="ws-thread-card__head">
                        {p.pathRisk ? <window.PathBadge/> : <window.CritBadge kind={p.criticality}/>}
                        <span className="ws-thread-card__title">{p.subject}</span>
                        <I.ChevronRight size={14} className="ws-thread-card__chev"/>
                      </div>
                      <div className="ws-thread-card__summary">{p.summary}</div>
                      <span className="ws-thread-card__open">Abrir thread <I.ArrowRight size={11}/></span>
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      </>
    );
  }

  function ThreadView({ parecer }) {
    if (!parecer) return null;
    const group = window.GROUPS[parecer.group];
    return (
      <>
        <div className="ws-head">
          <div className="ws-head__title"><span className="hash">#</span> {slug(parecer.subject)}</div>
          <div className="ws-head__meta">
            {parecer.pathRisk ? <window.PathBadge/> : <window.CritBadge kind={parecer.criticality}/>}
            <span>· {group.label} · {parecer.date}</span>
          </div>
        </div>
        <div className="ws-feed">
          <div className="ws-feed-inner">
            <div className="ws-msg">
              <div className="ws-msg__avatar--user ws-msg__avatar" style={{background:'#FEF3C7', color:'#92400E'}}>EP</div>
              <div className="ws-msg__body">
                <div className="ws-msg__head">
                  <span className="ws-msg__name">{parecer.senderName}</span>
                  <span className="ws-msg__time">{parecer.date}</span>
                </div>
                <div className="ws-msg__content">
                  <p>Encaminhada via matriz oficial. Solicitação registrada para análise contratual.</p>
                </div>
              </div>
            </div>

            <div className="ws-msg">
              <div className="ws-msg__avatar"><I.Sparkles size={18}/></div>
              <div className="ws-msg__body">
                <div className="ws-msg__head">
                  <span className="ws-msg__name">Meris AI</span>
                  <span className="ws-msg__time">há 4 minutos</span>
                </div>
                <div className="ws-msg__content">
                  <p>{parecer.summary}</p>
                  <p style={{color:'var(--color-text-secondary)', fontSize:13}}><strong>Justificativa:</strong> {parecer.justification}</p>
                  <p style={{marginTop:12, display:'flex', gap:6, flexWrap:'wrap'}}>
                    <button className="quick-action"><I.FileText size={12}/> Gerar relatório</button>
                    <button className="quick-action"><I.Bell size={12}/> Notificar grupo</button>
                    <button className="quick-action"><I.Refresh size={12}/> Reclassificar</button>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<ChatV2/>);
</script>
</body>
</html>
